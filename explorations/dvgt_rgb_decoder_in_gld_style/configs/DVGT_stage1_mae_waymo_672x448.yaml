# GLD-style stage-1 MAE RGB decoder training on frozen DVGT-1 features.
# This mirrors reproduce_gld_on_waymo as closely as possible while replacing
# DA3 feature extraction with DVGT aggregator features.

num_views: 4
n_corres_train: 0

waymo_root: /data/wlh/FreeDrive/data/waymo/processed-test
waymo_cameras: [0, 1, 2]

train_dataset: 50000 @ WaymoStage1_Multi(allow_repeat=False, split='train', ROOT="${waymo_root}", resolution=[(672, 448)], num_views=${num_views}, n_corres=${n_corres_train}, camera_ids=${waymo_cameras}, min_interval=1, max_interval=20, strict_aspect=True)
test_dataset: 200 @ WaymoStage1_Multi(allow_repeat=False, split='test', ROOT="${waymo_root}", resolution=[(672, 448)], num_views=${num_views}, n_corres=${n_corres_train}, camera_ids=${waymo_cameras}, min_interval=1, max_interval=20, strict_aspect=True)

dvgt:
  code_dir: /data/wlh/GLD/DVGT-code
  ckpt_dir: /data/wlh/GLD/DVGT-model/DVGT-1
  feature_indices: [4, 11, 17, 23]
  patch_size: 16
  token_dim_per_level: 3072
  per_level_layernorm: true
  freeze: true

decoder:
  config_path: explorations/dvgt_rgb_decoder_in_gld_style/decoder_ViTXL
  patch_size: 16
  hidden_size: 12288  # 3072 * 4 DVGT feature levels
  dropout: 0.0
  base_image_size: [448, 448]  # square base grid; interpolated to 448x672

training:
  epochs: 100
  ema_decay: 0.9978
  batch_size: 1
  num_workers: 16
  clip_grad: 0.0
  log_interval: 100
  validation_interval: 10000
  inference_checkpoint_interval: 10000
  precision: bf16
  global_seed: 0
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 50
    base_lr: 2.0e-4
    final_lr: 2.0e-5

gan:
  disc:
    arch:
      dino_ckpt_path: models/discs/dino_vit_small_patch8_224.pth
      ks: 9
      norm_type: bn
      using_spec_norm: true
      recipe: S_8
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 16
      base_lr: 2.0e-4
      final_lr: 2.0e-5
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    recon_weight: 1.0
    disc_start: 6
    disc_upd_start: 4
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1

reporting:
  val_batches: 200
  vis_samples: 4
