# GLD stage-1 MAE decoder reproduction on Waymo RGB frames.
# The training loop, model, optimizer, scheduler, EMA, LPIPS, and GAN settings
# mirror configs/training/DA3_stage1_mae.yaml. Only the dataset and resolution
# are changed.

num_views : 4
n_corres_train: 0

waymo_root: /data/wlh/FreeDrive/data/waymo/processed-test
waymo_cameras: [0, 1, 2]
# One (W, H) candidate: 1920x1280 -> 336x224, divisible by DA3 patch size 14.
# Keep the tuple literal in the dataset expression. OmegaConf list interpolation
# turns [(336, 224)] into a list object that does not eval the same way here.

train_dataset: 50000 @ WaymoStage1_Multi(allow_repeat=False, split='train', ROOT="${waymo_root}", resolution=[(336, 224)], num_views=${num_views}, n_corres=${n_corres_train}, camera_ids=${waymo_cameras}, min_interval=1, max_interval=20, strict_aspect=True)
test_dataset: 200 @ WaymoStage1_Multi(allow_repeat=False, split='test', ROOT="${waymo_root}", resolution=[(336, 224)], num_views=${num_views}, n_corres=${n_corres_train}, camera_ids=${waymo_cameras}, min_interval=1, max_interval=20, strict_aspect=True)

stage_1:
  target: stage1.rae_da3.RAE_DA3
  params:
    encoder_pretrained_path: '/data/wlh/GLD/model/pretrained_models/da3'
    encoder_input_size: 504
    encoder_type: 'DA3EncoderDirect'
    noise_tau: 0.0
    reshape_to_2d: true

decoder:
  config_path: 'reprojuce_gld_on_waymo/decoder_ViTXL'
  patch_size: 14
  hidden_size: 6144
  dropout: 0.0

training:
  epochs: 100
  ema_decay: 0.9978
  batch_size: 1
  num_workers: 16
  clip_grad: 0.0
  log_interval: 100
  checkpoint_interval: 5000
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 50
    base_lr: 2.0e-4
    final_lr: 2.0e-5

gan:
  disc:
    arch:
      dino_ckpt_path: 'models/discs/dino_vit_small_patch8_224.pth'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 16
      base_lr: 2.0e-4
      final_lr: 2.0e-5
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    recon_weight: 1.0
    disc_start: 6
    disc_upd_start: 4
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1


